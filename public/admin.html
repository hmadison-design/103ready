<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>103 Ready — Admin Stats</title>
<style>
  :root {
    --bg: #10151c; --panel: #1a2230; --text: #e8edf4; --dim: #8fa0b5;
    --accent: #f2b632; --good: #4caf7d; --bar: #2c3a50; --line: #263245;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .rate-wrap { display: flex; align-items: center; gap: 8px; min-width: 140px; }
  .rate-bar { flex: 1; height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
  .rate-fill { height: 100%; background: var(--good); border-radius: 4px; }
  .rate-num { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }
  .totals { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px; min-width: 140px; }
  .kpi .n { font-size: 26px; font-weight: 700; }
  .kpi .l { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .ending-name { color: var(--dim); }
  button {
    background: var(--accent); color: #10151c; border: none; border-radius: 8px;
    padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  input[type=password] {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); padding: 8px 12px; font-size: 14px; width: 260px;
  }
  #login { max-width: 420px; margin: 10vh auto; text-align: center; }
  #login .panel { padding: 28px; }
  .err { color: #e06c6c; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .stamp { color: var(--dim); font-size: 12px; }
  @media (max-width: 640px) { body { padding: 12px; } th, td { padding: 6px; font-size: 13px; } }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="panel">
    <h1>103 <span>Ready</span> — Admin</h1>
    <p class="sub">Enter the stats access token.</p>
    <input id="tok" type="password" placeholder="Access token" autocomplete="current-password">
    <p><button onclick="saveToken()">Sign in</button></p>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="dash" hidden>
  <div class="toolbar">
    <div>
      <h1>103 <span>Ready</span> — Completion Stats</h1>
      <div class="sub" id="stamp"></div>
    </div>
    <div>
      <button onclick="load()">Refresh</button>
      <button class="ghost" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="totals" id="kpis"></div>

  <div class="panel">
    <h2 style="font-size:15px;margin:0 0 10px;">Scenarios</h2>
    <table id="scTable">
      <thead><tr>
        <th>Scenario</th><th class="num">Starts</th><th class="num">Ending events</th>
        <th class="num">Unique completers</th><th>Completion rate</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="panel">
    <h2 style="font-size:15px;margin:0 0 10px;">Endings reached</h2>
    <table id="endTable">
      <thead><tr><th>Scenario</th><th>Ending</th><th class="num">Count</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  "use strict";
  var KEY = "r103_admin_token";

  window.saveToken = function () {
    var t = document.getElementById("tok").value.trim();
    if (!t) { return; }
    try { localStorage.setItem(KEY, t); } catch (e) {}
    load();
  };

  window.signOut = function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    show("login");
  };

  function show(which) {
    document.getElementById("login").hidden = which !== "login";
    document.getElementById("dash").hidden = which !== "dash";
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  window.load = function () {
    var token = null;
    try { token = localStorage.getItem(KEY); } catch (e) {}
    if (!token) { show("login"); return; }

    fetch("/api/stats", { headers: { "Authorization": "Bearer " + token } })
      .then(function (r) {
        if (r.status === 401) { throw new Error("unauthorized"); }
        if (!r.ok) { throw new Error("fetch failed (" + r.status + ")"); }
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        if (e.message === "unauthorized") {
          try { localStorage.removeItem(KEY); } catch (x) {}
          show("login");
          document.getElementById("loginErr").textContent = "Token rejected. Try again.";
        } else {
          show("login");
          document.getElementById("loginErr").textContent = "Error: " + e.message;
        }
      });
  };

  function render(data) {
    show("dash");
    document.getElementById("stamp").textContent =
      "Generated " + new Date(data.generated).toLocaleString();

    var totStarts = 0, totEndings = 0, totUnique = 0;
    var sc = data.scenarios || [];
    sc.forEach(function (s) {
      totStarts += s.starts || 0;
      totEndings += s.ending_events || 0;
      totUnique += s.unique_completers || 0;
    });

    document.getElementById("kpis").innerHTML =
      kpi(sc.length, "Scenarios with traffic") +
      kpi(totStarts, "Total starts") +
      kpi(totEndings, "Ending events") +
      kpi(totUnique, "Unique completers");

    var rows = sc.slice().sort(function (a, b) { return (b.starts || 0) - (a.starts || 0); })
      .map(function (s) {
        var rate = s.starts ? Math.min(100, Math.round(100 * s.unique_completers / s.starts)) : 0;
        return "<tr><td>" + esc(s.scenario) + "</td>" +
          "<td class=num>" + s.starts + "</td>" +
          "<td class=num>" + s.ending_events + "</td>" +
          "<td class=num>" + s.unique_completers + "</td>" +
          "<td><div class=rate-wrap><div class=rate-bar><div class=rate-fill style=\"width:" +
          rate + "%\"></div></div><div class=rate-num>" + rate + "%</div></div></td></tr>";
      }).join("");
    document.querySelector("#scTable tbody").innerHTML =
      rows || "<tr><td colspan=5 style='color:var(--dim)'>No events yet.</td></tr>";

    var er = (data.endings || []).map(function (e) {
      return "<tr><td>" + esc(e.scenario) + "</td><td class=ending-name>" +
        esc(e.ending) + "</td><td class=num>" + e.n + "</td></tr>";
    }).join("");
    document.querySelector("#endTable tbody").innerHTML =
      er || "<tr><td colspan=3 style='color:var(--dim)'>No endings yet.</td></tr>";
  }

  function kpi(n, label) {
    return "<div class=kpi><div class=n>" + n + "</div><div class=l>" + esc(label) + "</div></div>";
  }

  load();
}());
</script>
</body>
</html>
